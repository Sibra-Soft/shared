name: Build and publish NuGet package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $version = $env:RELEASE_TAG -creplace '^v', ''
            $number = '(0|[1-9][0-9]*)'
            $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            if ($version -cnotmatch "^$number\.$number\.$number(-$identifier(\.$identifier)*)?$") {
              throw 'Use a release tag such as v1.0.0 or v1.1.0-beta.1 (no build metadata).'
            }
            if ($env:IS_PRERELEASE -eq 'true' -and -not $version.Contains('-')) {
              throw 'A prerelease must have a prerelease suffix, e.g. v1.1.0-beta.1.'
            }
            if ($env:IS_PRERELEASE -eq 'false' -and $version.Contains('-')) {
              throw 'Mark releases with a prerelease version as a GitHub prerelease.'
            }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Shared.csproj

      - name: Build and pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet pack Shared.csproj --configuration Release --no-restore --output artifacts "-p:Version=$env:PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: github.event_name == 'release'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Set the NUGET_API_KEY repository Actions secret before publishing a release.'
          }
          dotnet nuget push "artifacts/*.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
